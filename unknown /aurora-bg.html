<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Void Bloom</title>
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --c1: #0a0012;
      --c2: #12002a;
      --ink: #e8d8ff;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: var(--c1);
      font-family: 'Georgia', serif;
    }

    /* ── Base void ── */
    .scene {
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 120% 100% at 50% 110%,
        #1a0035 0%,
        #0d001f 40%,
        #020008 100%
      );
    }

    /* ── Noise grain overlay ── */
    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");
      opacity: 0.045;
      pointer-events: none;
    }

    /* ── Slow aurora curtains ── */
    .aurora {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .aurora span {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      mix-blend-mode: screen;
      opacity: 0;
      animation: drift linear infinite;
    }

    .aurora span:nth-child(1) {
      width: 80vw; height: 60vh;
      top: -20%; left: -10%;
      background: radial-gradient(ellipse, #7b00ff 0%, transparent 70%);
      animation-duration: 28s;
      animation-delay: 0s;
    }
    .aurora span:nth-child(2) {
      width: 70vw; height: 50vh;
      top: 10%; right: -15%;
      background: radial-gradient(ellipse, #00c3ff 0%, transparent 70%);
      animation-duration: 34s;
      animation-delay: -10s;
    }
    .aurora span:nth-child(3) {
      width: 90vw; height: 40vh;
      bottom: -5%; left: 5%;
      background: radial-gradient(ellipse, #ff0080 0%, transparent 70%);
      animation-duration: 40s;
      animation-delay: -20s;
    }
    .aurora span:nth-child(4) {
      width: 60vw; height: 70vh;
      top: 20%; left: 20%;
      background: radial-gradient(ellipse, #0044ff 0%, transparent 70%);
      animation-duration: 22s;
      animation-delay: -5s;
    }
    .aurora span:nth-child(5) {
      width: 50vw; height: 50vh;
      bottom: 10%; right: 5%;
      background: radial-gradient(ellipse, #aa00ff 0%, transparent 70%);
      animation-duration: 30s;
      animation-delay: -15s;
    }

    @keyframes drift {
      0%   { transform: translate(0,   0)   scale(1);    opacity: 0;   }
      10%  { opacity: 0.55; }
      40%  { transform: translate(6vw,  -5vh) scale(1.15); opacity: 0.45; }
      70%  { transform: translate(-4vw, 8vh)  scale(0.95); opacity: 0.5;  }
      90%  { opacity: 0.4; }
      100% { transform: translate(0,   0)   scale(1);    opacity: 0;   }
    }

    /* ── Radial shimmer rings ── */
    .rings {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(180,100,255,0.12);
      animation: pulse-ring ease-in-out infinite alternate;
    }

    .ring:nth-child(1) { width: 20vmin; height: 20vmin; animation-duration: 5s;  animation-delay: 0s;   }
    .ring:nth-child(2) { width: 35vmin; height: 35vmin; animation-duration: 7s;  animation-delay: -1s;  }
    .ring:nth-child(3) { width: 52vmin; height: 52vmin; animation-duration: 9s;  animation-delay: -2s;  }
    .ring:nth-child(4) { width: 70vmin; height: 70vmin; animation-duration: 11s; animation-delay: -3s;  }
    .ring:nth-child(5) { width: 90vmin; height: 90vmin; animation-duration: 13s; animation-delay: -4s;  }
    .ring:nth-child(6) { width: 112vmin;height: 112vmin;animation-duration: 15s; animation-delay: -5s;  }

    @keyframes pulse-ring {
      from { opacity: 0.08; transform: scale(0.97); }
      to   { opacity: 0.28; transform: scale(1.03); }
    }

    /* ── Star field ── */
    .stars {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle ease-in-out infinite alternate;
    }

    /* Generate 60 stars via repeated selectors */
    .star:nth-child(1)  { width:1px;  height:1px;  top:5%;  left:12%; animation-duration:3.1s; animation-delay:-.5s; opacity:.7; }
    .star:nth-child(2)  { width:2px;  height:2px;  top:8%;  left:30%; animation-duration:2.4s; animation-delay:-1s;  opacity:.5; }
    .star:nth-child(3)  { width:1px;  height:1px;  top:15%; left:55%; animation-duration:4s;   animation-delay:-2s;  opacity:.8; }
    .star:nth-child(4)  { width:2px;  height:2px;  top:3%;  left:78%; animation-duration:3.5s; animation-delay:-0.3s;opacity:.6; }
    .star:nth-child(5)  { width:1px;  height:1px;  top:22%; left:91%; animation-duration:2.8s; animation-delay:-1.5s;opacity:.9; }
    .star:nth-child(6)  { width:2px;  height:2px;  top:33%; left:7%;  animation-duration:3.2s; animation-delay:-.8s; opacity:.5; }
    .star:nth-child(7)  { width:1px;  height:1px;  top:41%; left:43%; animation-duration:5s;   animation-delay:-2.5s;opacity:.7; }
    .star:nth-child(8)  { width:2px;  height:2px;  top:50%; left:62%; animation-duration:3.7s; animation-delay:-.2s; opacity:.6; }
    .star:nth-child(9)  { width:1px;  height:1px;  top:60%; left:20%; animation-duration:2.9s; animation-delay:-1.2s;opacity:.8; }
    .star:nth-child(10) { width:2px;  height:2px;  top:70%; left:85%; animation-duration:4.2s; animation-delay:-3s;  opacity:.5; }
    .star:nth-child(11) { width:1px;  height:1px;  top:77%; left:38%; animation-duration:3s;   animation-delay:-.7s; opacity:.7; }
    .star:nth-child(12) { width:2px;  height:2px;  top:85%; left:72%; animation-duration:2.6s; animation-delay:-1.8s;opacity:.6; }
    .star:nth-child(13) { width:1px;  height:1px;  top:92%; left:15%; animation-duration:3.8s; animation-delay:-.4s; opacity:.9; }
    .star:nth-child(14) { width:2px;  height:2px;  top:97%; left:50%; animation-duration:4.5s; animation-delay:-2.2s;opacity:.5; }
    .star:nth-child(15) { width:1px;  height:1px;  top:11%; left:66%; animation-duration:3.3s; animation-delay:-1.1s;opacity:.7; }
    .star:nth-child(16) { width:2px;  height:2px;  top:28%; left:82%; animation-duration:2.7s; animation-delay:-.6s; opacity:.8; }
    .star:nth-child(17) { width:1px;  height:1px;  top:45%; left:97%; animation-duration:4.1s; animation-delay:-2.8s;opacity:.6; }
    .star:nth-child(18) { width:2px;  height:2px;  top:57%; left:4%;  animation-duration:3.6s; animation-delay:-.9s; opacity:.5; }
    .star:nth-child(19) { width:1px;  height:1px;  top:66%; left:53%; animation-duration:2.5s; animation-delay:-1.6s;opacity:.9; }
    .star:nth-child(20) { width:2px;  height:2px;  top:80%; left:27%; animation-duration:4.8s; animation-delay:-3.5s;opacity:.7; }
    .star:nth-child(21) { width:1px;  height:1px;  top:18%; left:49%; animation-duration:3.4s; animation-delay:-.3s; opacity:.6; }
    .star:nth-child(22) { width:2px;  height:2px;  top:37%; left:89%; animation-duration:2.3s; animation-delay:-2.1s;opacity:.8; }
    .star:nth-child(23) { width:1px;  height:1px;  top:55%; left:35%; animation-duration:5.2s; animation-delay:-.7s; opacity:.5; }
    .star:nth-child(24) { width:2px;  height:2px;  top:73%; left:60%; animation-duration:3.9s; animation-delay:-1.3s;opacity:.7; }
    .star:nth-child(25) { width:1px;  height:1px;  top:89%; left:44%; animation-duration:2.7s; animation-delay:-2.7s;opacity:.9; }
    .star:nth-child(26) { width:2px;  height:2px;  top:6%;  left:22%; animation-duration:4.3s; animation-delay:-.1s; opacity:.6; }
    .star:nth-child(27) { width:1px;  height:1px;  top:24%; left:73%; animation-duration:3.1s; animation-delay:-1.9s;opacity:.8; }
    .star:nth-child(28) { width:2px;  height:2px;  top:48%; left:16%; animation-duration:2.9s; animation-delay:-.5s; opacity:.5; }
    .star:nth-child(29) { width:1px;  height:1px;  top:63%; left:94%; animation-duration:4.6s; animation-delay:-2.4s;opacity:.7; }
    .star:nth-child(30) { width:2px;  height:2px;  top:82%; left:8%;  animation-duration:3.7s; animation-delay:-.8s; opacity:.9; }
    /* extra scatter */
    .star:nth-child(31) { width:1px;  height:1px;  top:2%;  left:40%; animation-duration:4s;   animation-delay:-3.2s;opacity:.6; }
    .star:nth-child(32) { width:2px;  height:2px;  top:13%; left:95%; animation-duration:2.8s; animation-delay:-.2s; opacity:.7; }
    .star:nth-child(33) { width:1px;  height:1px;  top:31%; left:57%; animation-duration:5.1s; animation-delay:-1.4s;opacity:.8; }
    .star:nth-child(34) { width:2px;  height:2px;  top:44%; left:29%; animation-duration:3.5s; animation-delay:-2.6s;opacity:.5; }
    .star:nth-child(35) { width:1px;  height:1px;  top:59%; left:77%; animation-duration:2.6s; animation-delay:-.4s; opacity:.9; }
    .star:nth-child(36) { width:2px;  height:2px;  top:71%; left:3%;  animation-duration:4.4s; animation-delay:-1.7s;opacity:.6; }
    .star:nth-child(37) { width:1px;  height:1px;  top:88%; left:65%; animation-duration:3.2s; animation-delay:-.6s; opacity:.7; }
    .star:nth-child(38) { width:2px;  height:2px;  top:94%; left:87%; animation-duration:2.4s; animation-delay:-2.9s;opacity:.8; }
    .star:nth-child(39) { width:1px;  height:1px;  top:17%; left:11%; animation-duration:4.7s; animation-delay:-.1s; opacity:.5; }
    .star:nth-child(40) { width:2px;  height:2px;  top:39%; left:68%; animation-duration:3.3s; animation-delay:-1.3s;opacity:.7; }

    @keyframes twinkle {
      from { opacity: 0.1; transform: scale(0.8); }
      to   { opacity: 1;   transform: scale(1.4); }
    }

    /* ── Central singularity bloom ── */
    .bloom {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }

    .bloom-core {
      position: relative;
      width: 1px; height: 1px;
    }

    .bloom-glow {
      position: absolute;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      animation: breathe ease-in-out infinite alternate;
    }

    .bloom-glow:nth-child(1) {
      width: 4px; height: 4px;
      background: white;
      box-shadow:
        0 0 6px 3px rgba(255,255,255,0.9),
        0 0 20px 8px rgba(200,150,255,0.6),
        0 0 50px 20px rgba(120,0,255,0.3);
      animation-duration: 3s;
    }

    .bloom-glow:nth-child(2) {
      width: 200px; height: 200px;
      background: radial-gradient(circle,
        rgba(130,0,255,0.15) 0%,
        transparent 70%
      );
      animation-duration: 5s; animation-delay: -.5s;
    }

    .bloom-glow:nth-child(3) {
      width: 500px; height: 500px;
      background: radial-gradient(circle,
        rgba(80,0,180,0.08) 0%,
        transparent 70%
      );
      animation-duration: 8s; animation-delay: -1s;
    }

    @keyframes breathe {
      from { opacity: 0.7; transform: translate(-50%,-50%) scale(0.95); }
      to   { opacity: 1;   transform: translate(-50%,-50%) scale(1.05); }
    }

    /* ── Horizontal light seams ── */
    .seams {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .seam {
      position: absolute;
      left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg,
        transparent 0%,
        rgba(180,100,255,0.0) 10%,
        rgba(180,100,255,0.25) 30%,
        rgba(100,200,255,0.35) 50%,
        rgba(180,100,255,0.25) 70%,
        rgba(180,100,255,0.0) 90%,
        transparent 100%
      );
      animation: seam-scan linear infinite;
    }

    .seam:nth-child(1) { animation-duration: 18s; animation-delay:   0s; }
    .seam:nth-child(2) { animation-duration: 25s; animation-delay:  -9s; opacity: 0.7; }
    .seam:nth-child(3) { animation-duration: 32s; animation-delay: -18s; opacity: 0.5; }

    @keyframes seam-scan {
      from { top: -1px; }
      to   { top: 100%; }
    }

    /* ── Vignette ── */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 80% 80% at 50% 50%,
        transparent 40%,
        rgba(0,0,0,0.7) 100%
      );
      pointer-events: none;
    }

    /* ── Label ── */
    .label {
      position: absolute;
      bottom: 2.5rem;
      width: 100%;
      text-align: center;
      color: rgba(200,170,255,0.35);
      font-size: 0.65rem;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      pointer-events: none;
      font-family: 'Courier New', monospace;
    }
  </style>
</head>
<body>

  <div class="scene">

    <!-- Aurora curtains -->
    <div class="aurora">
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <!-- Pulsing rings -->
    <div class="rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>

    <!-- Star field -->
    <div class="stars">
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div><div class="star"></div><div class="star"></div>
      <div class="star"></div>
    </div>

    <!-- Singularity bloom -->
    <div class="bloom">
      <div class="bloom-core">
        <div class="bloom-glow"></div>
        <div class="bloom-glow"></div>
        <div class="bloom-glow"></div>
      </div>
    </div>

    <!-- Scanning light seams -->
    <div class="seams">
      <div class="seam"></div>
      <div class="seam"></div>
      <div class="seam"></div>
    </div>

    <!-- Edge vignette -->
    <div class="vignette"></div>

    <p class="label">void bloom &mdash; pure css</p>

  </div>

</body>
</html>
