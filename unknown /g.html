<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Profile</title>
    <style>
        /* --- Base Styles --- */
        :root {
            --bg-color: #5A4242;/* #f4f1ea;      /* Classic Ivory */
            --card-bg: #ffffff;
            --text-main: #2b2b2b;     /* Charcoal */
            --text-muted: #666666;
            --accent: #b89b5e;        /* Muted Gold */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* --- Profile Card --- */
        .card {
            background: var(--card-bg);
            max-width: 500px;
            width: 100%;
            padding: 40px 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            text-align: center;
            position: relative;
            
            /* Entrance Animation */
            opacity: 0;
            animation: fadeUp 1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        /* --- Avatar & Image --- */
        .avatar-container {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            position: relative;
            
            /* Pure CSS Pulse Animation */
            animation: pulse 3s infinite;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--card-bg);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        /* --- Typography --- */
        h1 {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 28px;
            font-weight: normal;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .title {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        .divider {
            width: 40px;
            height: 1px;
            background-color: var(--accent);
            margin: 0 auto 20px auto;
        }

        .bio {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* --- Social Links --- */
        .socials {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .socials a {
            color: var(--text-main);
            display: inline-block;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .socials a svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
            transition: fill 0.3s ease;
        }

        /* Hover Animations for Links */
        .socials a:hover {
            transform: translateY(-5px) scale(1.1);
            color: var(--accent);
        }

        /* --- Contact Button --- */
        .contact-btn {
            display: inline-block;
            text-decoration: none;
            color: var(--text-main);
            font-family: "Georgia", serif;
            font-style: italic;
            padding: 10px 25px;
            border: 1px solid var(--text-main);
            transition: all 0.3s ease;
        }

        .contact-btn:hover {
            background-color: var(--text-main);
            color: var(--card-bg);
            border-color: var(--text-main);
        }

        /* --- Keyframe Animations --- */
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(184, 155, 94, 0.4);
            }
            70% {
                box-shadow: 0 0 0 15px rgba(184, 155, 94, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(184, 155, 94, 0);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar-container">
            <img src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?auto=format&fit=crop&w=200&q=80" alt="Profile Picture" class="avatar">
        </div>
        
        <h1>Eleanor Vance</h1>

</body>
</html>
