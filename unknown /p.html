<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stunning Profile</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #050505;
            color: white;
            overflow: hidden; /* Hide scrollbars for full screen effect */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* Canvas Background */
        #bg-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Glassmorphism Profile Card */
        .profile-container {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            width: 350px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(255, 255, 255, 0.05);
            animation: floatCard 6s ease-in-out infinite;
            transition: transform 0.3s ease;
        }

        .profile-container:hover {
            transform: scale(1.02);
            box-shadow: 0 15px 45px rgba(0, 255, 200, 0.2), inset 0 0 20px rgba(255, 255, 255, 0.05);
        }

        /* Floating Animation */
        @keyframes floatCard {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0px); }
        }

        /* Profile Image */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid transparent;
            background: linear-gradient(#050505, #050505) padding-box, 
                        linear-gradient(45deg, #00f2fe, #4facfe, #00f2fe) border-box;
            margin-bottom: 20px;
            animation: glowAvatar 3s linear infinite;
        }

        @keyframes glowAvatar {
            0% { box-shadow: 0 0 10px #4facfe; }
            50% { box-shadow: 0 0 30px #00f2fe, 0 0 10px #4facfe; }
            100% { box-shadow: 0 0 10px #4facfe; }
        }

        /* Typography */
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            background: linear-gradient(to right, #4facfe 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p {
            font-size: 1rem;
            color: #cccccc;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        /* Typing effect for Subtitle */
        .typing-text {
            border-right: 2px solid #4facfe;
            white-space: nowrap;
            overflow: hidden;
            animation: typing 3s steps(30, end) infinite alternate, blink 0.75s step-end infinite;
        }

        @keyframes typing {
            from { width: 0 }
            to { width: 100% }
        }

        @keyframes blink {
            from, to { border-color: transparent }
            50% { border-color: #4facfe; }
        }

        /* Social Buttons */
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .social-btn {
            text-decoration: none;
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
            font-size: 0.9rem;
            letter-spacing: 1px;
        }

        .social-btn:hover {
            background: #4facfe;
            color: #050505;
            font-weight: bold;
            box-shadow: 0 0 15px #4facfe;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>

    <div class="profile-container">
        <img src="https://images.unsplash.com/photo-1511367461989-f85a21fda167?ixlib=rb-1.2.1&auto=format&fit=crop&w=500&q=80" alt="Profile Picture" class="profile-img">
        
        <h1>Aapka Naam Yahan</h1>
        <div style="display: inline-block;">
            <p class="typing-text">Creative Developer & Designer</p>
        </div>
        
        <div class="social-links">
            <a href="#" class="social-btn">Instagram</a>
            <a href="#" class="social-btn">GitHub</a>
            <a href="#" class="social-btn">Portfolio</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        
        let width, height, particles;
        
        // Mouse position tracking
        let mouse = {
            x: null,
            y: null,
            radius: 150
        };

        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // Resize Canvas
        function init() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            
            // Create particles based on screen size
            let numberOfParticles = (width * height) / 9000;
            for(let i = 0; i < numberOfParticles; i++) {
                particles.push(new Particle());
            }
        }

        // Particle Object
        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2 + 0.5;
                this.baseX = this.x;
                this.baseY = this.y;
                this.density = (Math.random() * 30) + 1;
                this.velocityX = (Math.random() * 1) - 0.5;
                this.velocityY = (Math.random() * 1) - 0.5;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = '#4facfe';
                ctx.fill();
            }

            update() {
                // Move naturally
                this.x += this.velocityX;
                this.y += this.velocityY;

                // Bounce off edges
                if(this.x < 0 || this.x > width) this.velocityX = -this.velocityX;
                if(this.y < 0 || this.y > height) this.velocityY = -this.velocityY;

                // Mouse interaction
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                
                if (distance < mouse.radius) {
                    // Push particles away
                    let forceDirectionX = dx / distance;
                    let forceDirectionY = dy / distance;
                    let maxDistance = mouse.radius;
                    let force = (maxDistance - distance) / maxDistance;
                    let directionX = forceDirectionX * force * this.density;
                    let directionY = forceDirectionY * force * this.density;
                    
                    this.x -= directionX;
                    this.y -= directionY;
                }
                
                this.draw();
            }
        }

        // Draw Lines between close particles
        function connect() {
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let dx = particles[a].x - particles[b].x;
                    let dy = particles[a].y - particles[b].y;
                    let distance = dx * dx + dy * dy;

                    if (distance < (width/10) * (height/10)) {
                        let opacity = 1 - (distance / 15000);
                        ctx.strokeStyle = `rgba(79, 172, 254, ${opacity})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        // Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
        }

        // Setup and Start
        init();
        animate();

        // Handle Window Resize
        window.addEventListener('resize', function() {
            init();
        });

        // Remove mouse interaction when mouse leaves screen
        window.addEventListener('mouseout', function() {
            mouse.x = undefined;
            mouse.y = undefined;
        });
    </script>
</body>
</html>
