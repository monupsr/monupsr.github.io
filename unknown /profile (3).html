<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Inconsolata:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1a1a18;
    --paper: #f5f0e8;
    --sepia: #8b7355;
    --gold: #c9a84c;
    --fade: #d4cfc6;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Cormorant Garamond', Georgia, serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 100;
    opacity: 0.6;
  }

  /* Decorative corner marks */
  .corner {
    position: fixed;
    width: 40px;
    height: 40px;
    opacity: 0;
    animation: fadeIn 1s ease forwards;
  }
  .corner::before, .corner::after {
    content: '';
    position: absolute;
    background: var(--sepia);
  }
  .corner::before { width: 1px; height: 100%; }
  .corner::after  { width: 100%; height: 1px; }
  .corner.tl { top: 24px; left: 24px; animation-delay: 0.2s; }
  .corner.tr { top: 24px; right: 24px; transform: scaleX(-1); animation-delay: 0.3s; }
  .corner.bl { bottom: 24px; left: 24px; transform: scaleY(-1); animation-delay: 0.4s; }
  .corner.br { bottom: 24px; right: 24px; transform: scale(-1); animation-delay: 0.5s; }

  /* Card */
  .card {
    position: relative;
    width: min(420px, 92vw);
    padding: 52px 48px 44px;
    text-align: center;
  }

  /* Thin border that draws itself */
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border: 1px solid var(--fade);
    clip-path: inset(0 100% 0 0);
    animation: drawBorder 1.2s cubic-bezier(0.4, 0, 0.2, 1) 0.3s forwards;
  }

  @keyframes drawBorder {
    to { clip-path: inset(0 0% 0 0); }
  }

  /* Avatar ring */
  .avatar-wrap {
    position: relative;
    display: inline-block;
    margin-bottom: 28px;
    opacity: 0;
    transform: translateY(12px);
    animation: riseIn 0.8s ease 0.8s forwards;
  }

  .avatar-ring {
    position: absolute;
    inset: -8px;
    border-radius: 50%;
    border: 1px solid var(--gold);
    opacity: 0.5;
    animation: spinSlow 18s linear infinite;
  }

  .avatar-ring::before {
    content: '';
    position: absolute;
    width: 5px;
    height: 5px;
    background: var(--gold);
    border-radius: 50%;
    top: 50%;
    left: -3px;
    transform: translateY(-50%);
  }

  @keyframes spinSlow {
    to { transform: rotate(360deg); }
  }

  .avatar {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    filter: sepia(15%) contrast(1.05);
    background: linear-gradient(135deg, var(--fade) 0%, var(--sepia) 100%);
    /* Placeholder initials via pseudo */
    position: relative;
  }

  /* Initials fallback */
  .avatar-initials {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #e8e0d0, #d4c9b0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cormorant Garamond', serif;
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--sepia);
  }

  /* Name */
  .name {
    font-size: 2rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    line-height: 1.1;
    text-transform: uppercase;
    opacity: 0;
    animation: riseIn 0.7s ease 1s forwards;
  }

  .name em {
    font-style: italic;
    font-weight: 300;
    display: block;
    font-size: 1.1rem;
    text-transform: none;
    letter-spacing: 0.04em;
    color: var(--sepia);
    margin-top: 2px;
  }

  /* Divider */
  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 20px 0;
    opacity: 0;
    animation: fadeIn 0.6s ease 1.2s forwards;
  }
  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, var(--fade));
  }
  .divider::after {
    background: linear-gradient(to left, transparent, var(--fade));
  }
  .divider-diamond {
    width: 5px;
    height: 5px;
    background: var(--gold);
    transform: rotate(45deg);
    flex-shrink: 0;
  }

  /* Bio */
  .bio {
    font-size: 0.95rem;
    font-weight: 300;
    line-height: 1.7;
    color: #555;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
    opacity: 0;
    animation: riseIn 0.7s ease 1.3s forwards;
  }

  /* Tags */
  .tags {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 6px;
    margin-bottom: 32px;
    opacity: 0;
    animation: riseIn 0.7s ease 1.5s forwards;
  }
  .tag {
    font-family: 'Inconsolata', monospace;
    font-size: 0.68rem;
    font-weight: 300;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--sepia);
    border: 1px solid var(--fade);
    padding: 3px 10px;
    border-radius: 2px;
    transition: border-color 0.3s, color 0.3s;
  }
  .tag:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  /* Social links */
  .socials {
    display: flex;
    justify-content: center;
    gap: 10px;
    opacity: 0;
    animation: riseIn 0.7s ease 1.7s forwards;
  }

  .social-link {
    display: flex;
    align-items: center;
    gap: 6px;
    text-decoration: none;
    color: var(--sepia);
    font-family: 'Inconsolata', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 8px 14px;
    border: 1px solid transparent;
    position: relative;
    transition: color 0.3s;
  }

  .social-link::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 0; height: 1px;
    background: var(--gold);
    transition: width 0.35s cubic-bezier(0.4,0,0.2,1);
  }

  .social-link:hover { color: var(--ink); }
  .social-link:hover::after { width: 100%; }

  .social-link svg {
    width: 13px;
    height: 13px;
    fill: currentColor;
    flex-shrink: 0;
    transition: transform 0.3s;
  }
  .social-link:hover svg { transform: translateY(-1px); }

  /* Email row */
  .email-row {
    margin-top: 20px;
    opacity: 0;
    animation: riseIn 0.7s ease 1.9s forwards;
  }

  .email-link {
    font-family: 'Inconsolata', monospace;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    color: #888;
    text-decoration: none;
    position: relative;
    padding-bottom: 2px;
    transition: color 0.3s;
  }
  .email-link::after {
    content: '';
    position: absolute;
    bottom: 0; left: 50%;
    width: 0; height: 1px;
    background: var(--sepia);
    transform: translateX(-50%);
    transition: width 0.4s ease;
  }
  .email-link:hover { color: var(--sepia); }
  .email-link:hover::after { width: 100%; }

  /* Footer note */
  .footnote {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Inconsolata', monospace;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--fade);
    opacity: 0;
    animation: fadeIn 1s ease 2.2s forwards;
  }

  /* Keyframes */
  @keyframes fadeIn {
    to { opacity: 1; }
  }
  @keyframes riseIn {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Subtle pulse on gold ring */
  @keyframes pulseFade {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 0.8; }
  }
  .avatar-ring { animation: spinSlow 18s linear infinite, pulseFade 4s ease-in-out infinite; }

  /* Reduced motion */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-delay: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="card">
  <div class="avatar-wrap">
    <div class="avatar-ring"></div>
    <div class="avatar-initials">AK</div>
  </div>

  <h1 class="name">
    Alex K.
    <em>Designer &amp; Developer</em>
  </h1>

  <div class="divider"><div class="divider-diamond"></div></div>

  <p class="bio">
    Crafting thoughtful digital experiences at the intersection of design and code. 
    Drawn to simplicity, honest typography, and work that endures.
  </p>

  <div class="tags">
    <span class="tag">UI Design</span>
    <span class="tag">Front-End</span>
    <span class="tag">Typography</span>
    <span class="tag">Open Source</span>
  </div>

  <div class="email-row">
    <a href="mailto:hello@example.com" class="email-link">hello@example.com</a>
  </div>
</div>

<div class="footnote">Available for new projects</div>

</body>
</html>
