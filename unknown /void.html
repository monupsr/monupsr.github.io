<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Void</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    .bg {
      width: 100%;
      height: 100%;
    }

    .bgi {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #06000f;

      /* ── 1. Base deep void gradient ── */
      background:
        radial-gradient(ellipse 60% 55% at 50% 50%,
          rgba(90, 20, 180, 0.18) 0%,
          transparent 70%),
        radial-gradient(ellipse 100% 80% at 50% 100%,
          rgba(40, 0, 100, 0.55) 0%,
          transparent 60%),
        #06000f;

      /* ── 2. Aurora blobs via pseudo only — use ::before & ::after on body ── */
    }

    /* ── Aurora blob A ── */
    .bgi::before {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(clamp(40px, 10vw, 110px));
      mix-blend-mode: screen;
      pointer-events: none;

      width: clamp(260px, 55vw, 680px);
      height: clamp(200px, 40vh, 480px);
      top: -10%;
      left: -8%;

      background: radial-gradient(ellipse,
        rgba(130, 40, 255, 0.55) 0%,
        rgba(60, 0, 180, 0.2)   50%,
        transparent             100%);

      animation: blob-a 22s ease-in-out infinite alternate;
    }

    @keyframes blob-a {
      0%   { transform: translate(0,    0)    scale(1);    opacity: .7; }
      33%  { transform: translate(8vw,  6vh)  scale(1.1);  opacity: .5; }
      66%  { transform: translate(-4vw, 12vh) scale(0.9);  opacity: .8; }
      100% { transform: translate(5vw, -4vh)  scale(1.05); opacity: .6; }
    }

    /* ── Aurora blob B ── */
    .bgi::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(clamp(50px, 12vw, 130px));
      mix-blend-mode: screen;
      pointer-events: none;

      width: clamp(220px, 50vw, 620px);
      height: clamp(180px, 38vh, 440px);
      bottom: -12%;
      right: -6%;

      background: radial-gradient(ellipse,
        rgba(0, 180, 255, 0.45) 0%,
        rgba(0, 80, 200, 0.18)  50%,
        transparent             100%);

      animation: blob-b 28s ease-in-out infinite alternate;
    }

    @keyframes blob-b {
      0%   { transform: translate(0,    0)    scale(1);    opacity: .6; }
      40%  { transform: translate(-6vw, -8vh) scale(1.15); opacity: .4; }
      70%  { transform: translate(4vw,  5vh)  scale(0.92); opacity: .7; }
      100% { transform: translate(-3vw, 9vh)  scale(1.08); opacity: .5; }
    }
    .bg::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;

      background-image:
        radial-gradient(1px 1px at  7%  5%,  rgba(255,255,255,.85) 0%, transparent 100%),
        radial-gradient(1px 1px at 14% 18%,  rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 23%  9%,  rgba(255,255,255,.70) 0%, transparent 100%),
        radial-gradient(1px 1px at 31% 27%,  rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(1px 1px at 42%  3%,  rgba(255,255,255,.90) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 15%,  rgba(255,255,255,.60) 0%, transparent 100%),
        radial-gradient(2px 2px at 58%  7%,  rgba(255,255,255,.40) 0%, transparent 100%),
        radial-gradient(1px 1px at 66% 22%,  rgba(255,255,255,.75) 0%, transparent 100%),
        radial-gradient(1px 1px at 75%  4%,  rgba(255,255,255,.85) 0%, transparent 100%),
        radial-gradient(2px 2px at 83% 13%,  rgba(255,255,255,.50) 0%, transparent 100%),
        radial-gradient(1px 1px at 91%  8%,  rgba(255,255,255,.65) 0%, transparent 100%),
        radial-gradient(1px 1px at 97% 25%,  rgba(255,255,255,.80) 0%, transparent 100%),
        radial-gradient(1px 1px at  3% 35%,  rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(2px 2px at 11% 48%,  rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 19% 41%,  rgba(255,255,255,.70) 0%, transparent 100%),
        radial-gradient(1px 1px at 28% 58%,  rgba(255,255,255,.40) 0%, transparent 100%),
        radial-gradient(1px 1px at 36% 44%,  rgba(255,255,255,.85) 0%, transparent 100%),
        radial-gradient(1px 1px at 47% 62%,  rgba(255,255,255,.60) 0%, transparent 100%),
        radial-gradient(2px 2px at 54% 37%,  rgba(255,255,255,.35) 0%, transparent 100%),
        radial-gradient(1px 1px at 63% 55%,  rgba(255,255,255,.75) 0%, transparent 100%),
        radial-gradient(1px 1px at 71% 43%,  rgba(255,255,255,.90) 0%, transparent 100%),
        radial-gradient(1px 1px at 80% 61%,  rgba(255,255,255,.50) 0%, transparent 100%),
        radial-gradient(2px 2px at 88% 49%,  rgba(255,255,255,.65) 0%, transparent 100%),
        radial-gradient(1px 1px at 94% 38%,  rgba(255,255,255,.80) 0%, transparent 100%),
        radial-gradient(1px 1px at  5% 72%,  rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 13% 85%,  rgba(255,255,255,.70) 0%, transparent 100%),
        radial-gradient(2px 2px at 22% 76%,  rgba(255,255,255,.40) 0%, transparent 100%),
        radial-gradient(1px 1px at 33% 91%,  rgba(255,255,255,.85) 0%, transparent 100%),
        radial-gradient(1px 1px at 44% 79%,  rgba(255,255,255,.60) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 95%,  rgba(255,255,255,.45) 0%, transparent 100%),
        radial-gradient(2px 2px at 64% 83%,  rgba(255,255,255,.75) 0%, transparent 100%),
        radial-gradient(1px 1px at 73% 70%,  rgba(255,255,255,.90) 0%, transparent 100%),
        radial-gradient(1px 1px at 82% 88%,  rgba(255,255,255,.55) 0%, transparent 100%),
        radial-gradient(1px 1px at 90% 76%,  rgba(255,255,255,.65) 0%, transparent 100%),
        radial-gradient(2px 2px at 96% 92%,  rgba(255,255,255,.35) 0%, transparent 100%);

      background-size: 100% 100%;
      background-repeat: no-repeat;
      animation: star-breathe 8s ease-in-out infinite alternate;
    }

    @keyframes star-breathe {
      from { opacity: .6; }
      to   { opacity: 1;  }
    }

    /* ── 4. Singularity + rings on html::after ── */
    .bg::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;

      background:
        /* centre glow — singularity */
        radial-gradient(circle 3px at 50% 50%,
          #ffffff 0%,
          rgba(255,255,255,0) 100%),

        /* halo 1 */
        radial-gradient(circle clamp(60px, 12vmin, 140px) at 50% 50%,
          rgba(200,150,255,0.22) 70%,
          rgba(200,150,255,0.0)  100%),

        /* halo 2 */
        radial-gradient(circle clamp(120px, 22vmin, 280px) at 50% 50%,
          rgba(140,80,255,0.12) 70%,
          transparent           100%),

        /* halo 3 */
        radial-gradient(circle clamp(220px, 38vmin, 480px) at 50% 50%,
          rgba(80,30,180,0.08) 70%,
          transparent          100%),

        /* outer halo */
        radial-gradient(circle clamp(340px, 55vmin, 700px) at 50% 50%,
          rgba(50,10,120,0.05) 70%,
          transparent          100%);

      animation: halo-pulse 5s ease-in-out infinite alternate;
    }

    @keyframes halo-pulse {
      from { opacity: .7; }
      to   { opacity: 1;  }
    }

    /* ── 5. Vignette via body box-shadow (inset) ── */
    /* No pseudo needed — we use box-shadow on the html for a vignette */
    .bg {
      box-shadow: inset 0 0 clamp(60px, 20vw, 260px) rgba(0,0,0,0.72);
    }

  </style>
</head>
<body>
  <div class="bg">
    <div class="bgi">
      
    </div>
  </div>
</body>
</html>
